name: Stage 27 - AsteroidOS baseline and Aurora UI
on:
  pull_request:
    paths:
      - '.github/workflows/stage27-asteroid-ui.yml'
      - 'stage27/**'
      - 'docs/STAGE27.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage27-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  baseline-and-preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install read-only image and Qt Quick test tools
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p stage27-artifacts
          timeout 300 sudo apt-get -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 -o Acquire::Retries=2 update -qq \
            2>&1 | tee stage27-artifacts/setup.log
          timeout 300 sudo apt-get -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 -o Acquire::Retries=2 \
            install -y --no-install-recommends e2fsprogs cmake qt6-base-dev qt6-declarative-dev \
            qtdeclarative5-dev-tools qml-module-qtquick2 qml-module-qtquick-window2 \
            qml-module-qttest qt6-declarative-dev-tools qt6-qpa-plugins qml6-module-qtquick \
            qml6-module-qtquick-window qml6-module-qttest qml6-module-qtqml \
            qml6-module-qtqml-models qml6-module-qtqml-workerscript xvfb xauth fonts-noto-cjk \
            2>&1 | tee -a stage27-artifacts/setup.log
      - name: Verify all pinned V1 assets and inspect rootfs without mounting
        run: python3 stage27/audit_v1.py stage27-work/v1 stage27-artifacts
      - name: Exercise UI interactions and render 384-pixel previews
        env:
          QT_QUICK_BACKEND: software
          QT_LOGGING_RULES: 'qt.qpa.xcb.warning=false'
        run: |
          timeout 90 xvfb-run -a /usr/lib/qt5/bin/qmltestrunner -input stage27/tests \
            -o stage27-artifacts/qml-tests-qt5.txt,txt -o -,txt
          timeout 90 xvfb-run -a /usr/lib/qt6/bin/qmltestrunner -input stage27/tests \
            -o stage27-artifacts/qml-tests-qt6.txt,txt -o -,txt
      - name: Build Qt 6 entry point and capture complete windows
        env:
          QT_QUICK_BACKEND: software
        run: |
          cmake -S stage27/native -B stage27-work/native -DCMAKE_BUILD_TYPE=Release
          cmake --build stage27-work/native --parallel 2
          timeout 30 xvfb-run -a stage27-work/native/aurora-preview \
            --capture-dir "$PWD/stage27-artifacts"
      - name: Package standalone preview and verify manifest
        run: |
          python3 stage27/package_preview.py stage27-artifacts
          cd stage27-artifacts
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-stage27-QML-PREVIEW
          path: stage27-artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Save reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-stage27-FAILURE-REPORTS
          path: stage27-artifacts/
          retention-days: 30
          if-no-files-found: ignore
