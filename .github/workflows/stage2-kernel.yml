name: Stage 2 - Kernel and built-in initramfs (UNVERIFIED)

on:
  pull_request:
    paths:
      - '.github/workflows/stage2-kernel.yml'
      - 'scripts/**'
      - 'board/**'
      - 'configs/**'
      - 'docs/STAGE2.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage2:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4

      - name: Install Buildroot and cross-compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison cpio curl file flex git gzip \
            libelf-dev libncurses-dev libssl-dev lz4 make patch perl \
            python3 rsync sed tar unzip wget xz-utils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu dwarves

      - name: Kernel preflight — compile BAM, SCM and QUSB only
        shell: bash
        run: |
          set -o pipefail
          bash scripts/stage2-preflight.sh 2>&1 | tee stage2-preflight.log

      - name: Restore ARM32 rootfs cache
        id: rootfs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            stage2-work/br-output/images/rootfs.tar
            stage2-work/br-output/images/rootfs.cpio.gz
          key: aurora-arm32-rootfs-v1-${{ hashFiles('configs/aurora_arm32_defconfig', 'board/google/aurora/rootfs-overlay/**', 'external.desc', 'external.mk', 'Config.in') }}

      - name: Build or verify cached rootfs
        shell: bash
        run: |
          set -o pipefail
          bash scripts/stage2-rootfs.sh 2>&1 | tee stage2-rootfs.log

      - name: Save ARM32 rootfs cache before full kernel build
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            stage2-work/br-output/images/rootfs.tar
            stage2-work/br-output/images/rootfs.cpio.gz
          key: aurora-arm32-rootfs-v1-${{ hashFiles('configs/aurora_arm32_defconfig', 'board/google/aurora/rootfs-overlay/**', 'external.desc', 'external.mk', 'Config.in') }}

      - name: Compile ARM64 Image and assemble unverified boot.img
        shell: bash
        run: |
          set -o pipefail
          bash scripts/stage2-build.sh 2>&1 | tee stage2-build.log

      - name: Upload Stage 2 diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-stage2-build-logs
          path: |
            stage2-preflight.log
            stage2-rootfs.log
            stage2-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload research-only boot artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-stage2-boot-UNVERIFIED-DO-NOT-FLASH
          path: stage2-artifacts/
          retention-days: 7
          if-no-files-found: error
