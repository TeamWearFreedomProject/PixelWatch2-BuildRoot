name: Stage 26 - Embedded USB rescue
on:
  pull_request:
    paths:
      - '.github/workflows/stage26-embedded-usb.yml'
      - 'stage26/**'
      - 'docs/STAGE26.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage26-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate archive isolation, config delta, boot and failure handling
        run: |
          bash -n stage26/build.sh stage26/prepare.sh
          sh -n stage26/overlay/init
          python3 -m unittest discover -s stage25 -p 'test_*.py' -v
          python3 -m unittest discover -s stage26 -p 'test_*.py' -v
  initramfs:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install userspace-only ARM64 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user lz4
      - name: Build and validate private static initramfs
        run: bash stage26/prepare.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-stage26-INITRAMFS-CI-INPUT
          path: |
            stage26-work/diagnostic/diagnostic.cpio
            stage26-work/diagnostic/diagnostic.cpio.gz
            stage26-work/diagnostic/baseline.config
            stage26-work/diagnostic/initramfs.json
            stage26-work/diagnostic/SHA256SUMS
          retention-days: 30
          if-no-files-found: error
  embedded-kernel:
    needs: initramfs
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aurora-stage26-INITRAMFS-CI-INPUT
          path: stage26-work/diagnostic
      - name: Install original kernel build dependencies without an ARM64 libc sysroot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison build-essential \
            ca-certificates cpio curl fakeroot flex git kmod libelf-dev libssl-dev \
            libtinfo5 lz4 python2 python3 unzip wget xz-utils pahole libbpf-dev \
            binutils-aarch64-linux-gnu qemu-system-arm gzip
      - name: Fetch, check config before compilation, and build embedded kernel
        run: |
          set -euo pipefail
          bash stage26/build.sh 2>&1 | tee stage26-build.log
      - name: Retain kernel for CI debugging before VM validation
        uses: actions/upload-artifact@v4
        with:
          name: aurora-stage26-KERNEL-CI-INPUT-UNTESTED
          path: stage26-artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Boot final image kernel in diskless QEMU and verify the actual deadline
        run: python3 stage26/qemu_check.py stage26-artifacts stage26-work/qemu
      - name: Generate tested candidate capture guide and checksums
        run: |
          cp docs/STAGE26.md stage26-artifacts/README-STAGE26.md
          python3 stage26/make_capture.py stage26-artifacts
          cd stage26-artifacts
          sha256sum boot-stage26-usb.img *.json *.md kernel.config qemu-boot.log > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-stage26-EMBEDDED-USB-DIAGNOSTIC
          path: stage26-artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-stage26-BUILD-LOGS
          path: |
            stage26-build.log
            stage26-artifacts/*.json
            stage26-artifacts/qemu-boot.log
            stage26-work/diagnostic/*.json
            stage26-work/port/workdir/downloads/KERNEL_OBJ/.config
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore
